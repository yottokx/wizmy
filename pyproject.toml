[project]
name = "wizmy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite==0.22.1",
    "cryptography==48.0.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "langchain==1.3.1",
    "langchain-core==1.4.0",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.2.1",
    "nicegui==3.12.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
files = [
    "src/core",
    "src/services",
    "src/storage",
    "src/config.py",
    "src/app_context.py",
]
exclude = [
    "^src/ui/",
]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "langchain_ollama.*",
    "langchain_openai.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E402",
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["F401"]
"src/services/tts.py" = ["F401"]
"src/ui/chat/controller.py" = ["F401"]
"src/ui/pages/character_detail.py" = ["F841"]
"src/ui/pages/characters.py" = ["F841"]
"src/ui/pages/group_chat.py" = ["F841"]

[tool.ruff.format]
quote-style = "preserve"
